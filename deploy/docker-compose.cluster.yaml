x-aikv-node: &aikv-node
  image: ${AIKV_IMAGE:-aikv:dev}
  command: ["--config", "/etc/aikv/aikv.toml"]
  restart: unless-stopped
  networks:
    - aikv-cluster

services:
  aikv-1:
    <<: *aikv-node
    container_name: aikv-1
    ports:
      - "6379:6379"
      - "16379:16379"
      - "26379:26379"
      - "9191:9191"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node1/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv1-data:/var/lib/aikv/data

  aikv-2:
    <<: *aikv-node
    container_name: aikv-2
    ports:
      - "6380:6380"
      - "16380:16380"
      - "26380:26380"
      - "9192:9192"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node2/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv2-data:/var/lib/aikv/data

  aikv-3:
    <<: *aikv-node
    container_name: aikv-3
    ports:
      - "6381:6381"
      - "16381:16381"
      - "26381:26381"
      - "9193:9193"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node3/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv3-data:/var/lib/aikv/data

  aikv-4:
    <<: *aikv-node
    container_name: aikv-4
    ports:
      - "7379:7379"
      - "17379:17379"
      - "27379:27379"
      - "9194:9194"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node4/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv4-data:/var/lib/aikv/data

  aikv-5:
    <<: *aikv-node
    container_name: aikv-5
    ports:
      - "7380:7380"
      - "17380:17380"
      - "27380:27380"
      - "9195:9195"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node5/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv5-data:/var/lib/aikv/data

  aikv-6:
    <<: *aikv-node
    container_name: aikv-6
    ports:
      - "7381:7381"
      - "17381:17381"
      - "27381:27381"
      - "9196:9196"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node6/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv6-data:/var/lib/aikv/data

networks:
  aikv-cluster:
    name: aikv-cluster

volumes:
  aikv1-data:
    name: aikv1-data
  aikv2-data:
    name: aikv2-data
  aikv3-data:
    name: aikv3-data
  aikv4-data:
    name: aikv4-data
  aikv5-data:
    name: aikv5-data
  aikv6-data:
    name: aikv6-data
