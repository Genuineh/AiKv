[package]
name = "ak"
version = "0.1.0"
edition = "2021"
authors = ["Jerry"]
description = "AiKv 现代分布式 KV 存储管理工具"

[[bin]]
name = "ak"
path = "src/main.rs"

[dependencies]
# CLI parsing - The industry standard
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Error handling
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9"
dirs = "6.0"

# Logging & Output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "3.0"
libc = "0.2"
sysinfo = "0.38"
redis = { version = "1.0.3", features = ["tokio-comp"] }
indicatif = "0.18.3"
tera = "1.20.1"
comfy-table = "7.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
