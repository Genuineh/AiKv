# ============================================================
# OpenTelemetry Collector Configuration for AiKv
# ============================================================
#
# Pipeline:
#   AiKv (OTLP) --> OTel Collector --> Jaeger (traces)   --> Grafana Explore / Jaeger UI
#                                  --> Tempo (traces)     --> Grafana Drilldown / Explore
#                                  --> Prometheus (metrics)
#

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 批量处理, 减少网络开销
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # 内存限制, 防止 OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # 转发 traces 到 Jaeger (via OTLP)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # 转发 traces 到 Tempo (via OTLP), 用于 Drilldown / TraceQL
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # 转换 OTLP metrics 为 Prometheus 格式
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: aikv_otel

  # 调试日志 (开发时可启用)
  # debug:
  #   verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
