# ============================================================
# Prometheus Configuration for AiKv Monitoring
# ============================================================
#
# 热加载配置: curl -X POST http://localhost:9090/-/reload
#

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus 自身指标
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "prometheus"

  # AiKv Redis 协议指标 (通过 redis-exporter 采集)
  - job_name: "aikv-exporter"
    static_configs:
      - targets: ["aikv-exporter:9121"]
        labels:
          instance: "aikv"
          service: "aikv"

  # 宿主机系统指标 (CPU, Memory, Disk, Network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "host"

  # OpenTelemetry Collector 指标 (包含 AiKv OTLP 指标)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          instance: "otel-collector"
