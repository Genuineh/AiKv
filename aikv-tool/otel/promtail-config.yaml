# ============================================================
# Promtail Configuration for AiKv Log Collection
# ============================================================
#
# 自动发现 Docker 容器日志并推送到 Loki
#

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ""
    batchwait: 1s
    batchsize: 1048576    # 1MB

scrape_configs:
  # Docker 容器日志自动发现
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      # 提取容器名称
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # 提取日志流类型 (stdout/stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "logstream"
      # 提取 Compose 服务名
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # 提取 Compose 项目名
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
    pipeline_stages:
      # Docker 原始日志解析（提取时间戳、行等）
      - docker: {}
      # 通用标签设置（适用于所有容器）
      - labels:
          container:
          logstream:
          project:
          service:
      # 为 AiKv 服务添加特殊处理（包含本 compose 的 aikv 与 ak 的 aikv1 等）
      - match:
          selector: '{service=~"aikv*.*"}'
          stages:
            # 阶段 1: 清理 ANSI 转义码
            - replace:
                expression: '\x1B\\[[0-9;]*[mKHF]'  # ANSI escape codes
                replacement: ''
            # 阶段 2: 提取日志级别（用于过滤和着色）
            - regex:
                expression: '(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)'
            # 阶段 3: 设置标签
            - labels:
                level:
