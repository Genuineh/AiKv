# ============================================================
# Grafana Datasource Provisioning for AiKv Monitoring
# ============================================================
#
# Grafana 启动时自动加载以下数据源, 无需手动配置
#

apiVersion: 1

# 清理旧数据源 (UID 变更时必须先删除再重建)
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Pyroscope
    orgId: 1

datasources:
  # Prometheus - 指标数据源 (默认)
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # Jaeger - 链路追踪数据源 (Explore / Jaeger UI)
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true

  # Tempo - 链路追踪数据源 (Drilldown Traces / TraceQL)，经 tempo-proxy 重写 nestedSetParent 以兼容 Trace Exploration
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo-proxy:3201
    editable: true
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      # 从 Trace 跳转到 Prometheus 指标，便于调优时做关联分析
      tracesToMetrics:
        - datasourceUid: prometheus
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"

  # Loki - 日志数据源
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # 服务名称映射：从 service 标签识别服务
      serviceMap:
        labelToRootIdentifier: "service"
      derivedFields:
        # 从日志中提取 trace ID, 自动关联到 Jaeger
        - datasourceUid: jaeger
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
        # 同上, 关联到 Tempo
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # Pyroscope - 持续剖析数据源 (Profiles Drilldown / 火焰图, 供 AiKv 性能调优)
  - name: Pyroscope
    uid: pyroscope
    type: phlare
    access: proxy
    url: http://pyroscope:4040
    editable: true
    jsonData:
      backendType: phlare
      minStep: "15s"
