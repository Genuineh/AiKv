[package]
name = "aikv"
version = "0.2.2"
edition = "2021"
authors = ["Jerry"]
description = "Redis protocol compatible key-value store based on AiDb"
license = "MIT"
repository = "https://github.com/Genuineh/AiKv"
readme = "README.md"
keywords = ["redis", "kvstore", "database", "resp"]
categories = ["database", "network-programming"]

[features]
default = []
cluster = ["aidb/raft-cluster", "openraft", "tonic", "redis"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking and serialization
bytes = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"

# OpenTelemetry tracing
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
tracing-opentelemetry = "0.22"

# Configuration
toml = "0.8"

# Storage engine
aidb = { path = "../AiDb" }

# Raft consensus (optional, for cluster mode)
openraft = { version = "0.9", features = ["serde"], optional = true }
# gRPC transport used for Raft RPC server (optional, enabled with `cluster` feature)
tonic = { version = "0.11", features = ["transport"], optional = true }
# Redis async client used for cluster-internal command forwarding (optional)
redis = { version = "0.24", optional = true, features = ["tokio-comp"] }

# Lua scripting
mlua = { version = "0.10", features = ["lua54", "async", "send", "vendored"] }
sha1 = "0.10"
rand = "0.8"

# MessagePack serde used by Raft payloads
rmp-serde = "1.1"

# Temporary files for RDB operations
tempfile = "3.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
redis = { version = "0.24", features = ["tokio-comp"] }

[[bin]]
name = "aikv"
path = "src/main.rs"

[[bench]]
name = "aikv_benchmark"
harness = false

[[bench]]
name = "comprehensive_benchmark"
harness = false
