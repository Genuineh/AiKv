[package]
name = "aikv"
version = "0.10.5"
edition = "2021"
description = "Redis RESP protocol compatible KV server based on aidb"
license = "MIT"

[[bin]]
name = "aikv"
path = "src/main.rs"

[features]
default = []
monitoring = ["dep:tracing-opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "aidb/monitoring"]
cluster = ["aidb/cluster"]
compression = ["aidb/compression"]
cluster-test-util = ["cluster", "aidb/cluster-test-util"]

[dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Core primitives
parking_lot = "0.12"
dashmap = "6"
bytes     = "1"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
bincode   = "1"
rmp-serde = "1"
sha1      = "0.10"
itoa = "1"
ryu = "1"
crc32fast = "1"
rand      = "0.8"

# Logging & tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Lua scripting
mlua = { version = "0.10", features = ["lua54", "async", "send", "vendored"] }

# AiDb storage engine
aidb = { path = "../aidb" }

# Monitoring (optional)
# Metrics HTTP server (monitoring feature)
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
redis    = { version = "0.24", features = ["tokio-comp"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1"

[profile.release]
lto           = true
codegen-units = 1
debug         = 1   # C3.2: line tables for eBPF/Pyroscope flame graphs (AiFactory image 不 strip)
