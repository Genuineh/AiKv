# AiKv 崩溃恢复测试集群 (3 节点, 1 分片)
name: aikv-e2e-crash

x-aikv-base: &aikv-base
  image: ${AIKV_IMAGE:-aikv:dev-test-util}
  labels:
    app: "aikv-crash-test"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - aikv-crash-net
  healthcheck:
    test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  environment: &aikv-common-env
    AIKV_CLUSTER_ANNOUNCE_MODE: unknown
    RUST_LOG: info
    AIKV_JSON_LOG: "true"

services:
  node-1:
    <<: *aikv-base
    container_name: aikv-crash-1
    environment:
      <<: *aikv-common-env
      AIKV_BIND: "0.0.0.0:6379"
      AIKV_CLUSTER_NODE_ID: "1"
      AIKV_CLUSTER_RPC_ADDR: "node-1:16379"
      AIKV_CLIENT_ADDR: "127.0.0.1:6379"
      AIKV_HEALTH_PORT: "6379"
    ports:
      - "6379:6379"

  node-2:
    <<: *aikv-base
    container_name: aikv-crash-2
    environment:
      <<: *aikv-common-env
      AIKV_BIND: "0.0.0.0:6379"
      AIKV_CLUSTER_NODE_ID: "2"
      AIKV_CLUSTER_RPC_ADDR: "node-2:16379"
      AIKV_CLIENT_ADDR: "127.0.0.1:6380"
      AIKV_HEALTH_PORT: "6379"
    ports:
      - "6380:6379"

  node-3:
    <<: *aikv-base
    container_name: aikv-crash-3
    environment:
      <<: *aikv-common-env
      AIKV_BIND: "0.0.0.0:6379"
      AIKV_CLUSTER_NODE_ID: "3"
      AIKV_CLUSTER_RPC_ADDR: "node-3:16379"
      AIKV_CLIENT_ADDR: "127.0.0.1:6381"
      AIKV_HEALTH_PORT: "6379"
    ports:
      - "6381:6379"

networks:
  aikv-crash-net:
    driver: bridge
