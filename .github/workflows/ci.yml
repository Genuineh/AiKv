name: CI

on:
  push:
    branches: [main, new/main, new/wiqun]
  pull_request:
    branches: [main, new/main, new/wiqun]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Checkout AiDb (path dependency)
        uses: actions/checkout@v4
        with:
          repository: wiqun/AiDb
          path: .aidb
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Link AiDb for path dependency
        run: ln -sf $PWD/.aidb ../aidb

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features cluster

      - name: Test
        run: cargo test --workspace --features cluster

  ignored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Checkout AiDb (path dependency)
        uses: actions/checkout@v4
        with:
          repository: wiqun/AiDb
          path: .aidb
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Link AiDb for path dependency
        run: ln -sf $PWD/.aidb ../aidb

      - name: Test ignored (slow tests)
        run: cargo test --features cluster -- --ignored --test-threads=1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Checkout AiDb (path dependency)
        uses: actions/checkout@v4
        with:
          repository: wiqun/AiDb
          path: .aidb
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Link AiDb for path dependency
        run: ln -sf $PWD/.aidb ../aidb

      - name: Build release (with cluster features for all tests)
        run: cargo build --release --features cluster

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Run E2E tests (cluster only)
        run: |
          if ls e2e/test_cluster_*.sh 2>/dev/null; then
            for test in e2e/test_cluster_*.sh; do
              echo "Running $test..."
              bash "$test" || { echo "FAIL: $test" >&2; exit 1; }
            done
          else
            echo "No cluster E2E tests found, skipping."
          fi
